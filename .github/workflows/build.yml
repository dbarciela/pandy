# Tests on every push to main. A "v*" tag builds the release APK (signed with the release key from the repository's
# secrets) and an unsigned iOS .ipa, and attaches both to a GitHub Release; Actions → Build → Run workflow builds a
# debug APK for testing.
name: Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (leave blank for run without release, or specify e.g. v1.0.20)'
        required: false
        type: string
        default: ''
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Test
        run: |
          python3 .github/scripts/public_issue_patch.py --self-test
          python3 tools/check_codecov.py --self-test
          ./gradlew testDebugUnitTest :shared:koverXmlReportDebug :shared:koverVerifyDebug

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: shared/build/reports/kover/reportDebug.xml
          retention-days: 1

      - name: Build isolated Android UI test app
        run: ./gradlew -Ppandy.testbed assembleDebug

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Android demo UI and pause/resume round trip
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash tools/android-smoke.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Android UI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-ui-evidence
          path: build/android-smoke/

      # Build APK for distribution: signed with release key if present, otherwise debug APK.
      - name: Build APK for distribution
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PANDY_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PANDY_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PANDY_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          TAG_INPUT: ${{ inputs.tag_name }}
        run: |
          TARGET_TAG="${TAG_INPUT:-$GITHUB_REF_NAME}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Building signed release APK..."
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            PANDY_KEYSTORE="$RUNNER_TEMP/release.jks" ./gradlew assembleRelease
            APK_SRC="app/build/outputs/apk/release/app-release.apk"
          else
            echo "No KEYSTORE_BASE64 secret provided; building debug APK for distribution..."
            ./gradlew assembleDebug
            APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_SRC" pandy.apk
          if [ -n "$TARGET_TAG" ] && [ "$TARGET_TAG" != "main" ]; then
            cp "$APK_SRC" "pandy-${TARGET_TAG}.apk"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        with:
          name: apk
          path: pandy*.apk

  # Unsigned .ipa: sign it with your own Apple ID via SideStore or AltStore. Plus one simulator screenshot of the
  # first screen, to check the app starts.
  ios:
    # Releases and manual runs only: a pushed commit doesn't need a new .ipa.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      - name: Shared tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Build unsigned .ipa
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build/ios" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/ios/Release-iphoneos/Pandy.app Payload/
          # A "v1.2.3" tag stamps its version on the app, so the label never lags the Android version.
          if [[ "$GITHUB_REF_NAME" == v* ]]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" -c "Set :CFBundleVersion ${GITHUB_REF_NAME#v}" Payload/Pandy.app/Info.plist
          fi
          zip -qry pandy.ipa Payload

      - name: Simulator screenshot of the first screen
        run: |
          xcodebuild -project iosApp/iosApp.xcodeproj -target iosApp -configuration Debug -sdk iphonesimulator -arch arm64 \
            SYMROOT="$PWD/build/ios-sim" CODE_SIGNING_ALLOWED=NO build
          TYPE=$(xcrun simctl list devicetypes | grep -oE 'com.apple.CoreSimulator.SimDeviceType.iPhone-1[0-9](-Pro)?' | tail -1)
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'com.apple.CoreSimulator.SimRuntime.iOS-[0-9-]+' | tail -1)
          DEV=$(xcrun simctl create pandy "$TYPE" "$RUNTIME")
          xcrun simctl boot "$DEV" && xcrun simctl bootstatus "$DEV"
          xcrun simctl install "$DEV" build/ios-sim/Debug-iphonesimulator/Pandy.app
          mkdir -p screenshots
          xcrun simctl launch "$DEV" io.github.gccammelli.pandy; sleep 25
          xcrun simctl io "$DEV" screenshot screenshots/1-connect.png
          xcrun simctl ui "$DEV" appearance dark; sleep 5
          xcrun simctl io "$DEV" screenshot screenshots/2-connect-dark.png
          xcrun simctl spawn "$DEV" log show --last 2m --predicate 'process == "Pandy"' --style compact | tail -100 > screenshots/app-log.txt || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ios
          path: |
            pandy.ipa
            screenshots/

  coverage:
    needs: android
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        continue-on-error: true
        with:
          files: reportDebug.xml
          flags: android-unit
          fail_ci_if_error: false
          use_oidc: true
          disable_search: true

      - name: Verify fully covered lines in Codecov
        continue-on-error: true
        env:
          COVERAGE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/check_codecov.py "$GITHUB_REPOSITORY" "$COVERAGE_SHA"

  release:
    needs: android
    if: (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')) && needs.android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: ios
          path: ios-artifact
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          files: |
            release/*.apk
            ios-artifact/pandy.ipa
          fail_on_unmatched_files: false
          generate_release_notes: true

  discord:
    name: Announce release in Discord
    needs: release
    if: startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success' && vars.PANDY_RELEASE_ANNOUNCEMENTS != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Post release
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ secrets.DISCORD_RELEASE_CHANNEL_ID }}
          RELEASE_NAME: ${{ github.event.repository.name }}
          RELEASE_URL: "https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
        run: |
          if [ -z "$DISCORD_BOT_TOKEN" ] || [ -z "$DISCORD_RELEASE_CHANNEL_ID" ]; then
            echo "Discord bot token or channel ID not configured, skipping announcement."
            exit 0
          fi
          payload=$(jq -n --arg content "$RELEASE_NAME $GITHUB_REF_NAME is released: $RELEASE_URL" '{content: $content}')
          curl --fail-with-body --retry 2 --retry-all-errors \
            -H "Authorization: Bot $DISCORD_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$payload" \
            "https://discord.com/api/v10/channels/$DISCORD_RELEASE_CHANNEL_ID/messages"
